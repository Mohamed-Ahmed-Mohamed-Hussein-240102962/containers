name: CI pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches: main
    types: [opened,edited]
  release:
    types: [published]
env:
  MONGODB_DB_NAME: gha-demo
jobs:
  integration-test:
    runs-on: ubuntu-latest
    container:
      image:  node:24-alpine
    
    env:
        MONGODB_CONNECTION_PROTOCOL: mongodb
        MONGODB_CLUSTER_ADDRESS: mongodb
        MONGODB_USERNAME: root
        MONGODB_PASSWORD: example
        PORT: 8080  
    services:
      mongodb:
        image: mongo
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
        ports:
          - 27017:27017

    steps:
      - name: Get Code
        uses: actions/checkout@v6
      - name: dep
        uses: Mohamed-Ahmed-Mohamed-Hussein-240102962/standalone/dep@main
      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:$PORT 
      - name: Run tests
        run: npm test
        id: test
      - name: Output information
        run: |
          echo "The test is -${{steps.test.outcome}}"
  build-push:
    needs: integration-test
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: image full stack
        uses: Mohamed-Ahmed-Mohamed-Hussein-240102962/standalone/doc@main
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          pass: ${{secrets.DOCKER_PASSWORD}}
          image: moopsdev/customexpress
         
        
